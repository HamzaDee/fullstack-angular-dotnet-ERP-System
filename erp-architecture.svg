<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc"><title id="title">Enterprise ERP · system architecture</title><desc id="desc">Angular to ASP.NET Core to Business logic to EF Core to SQL Server. UI workflows connect to a separate business API and relational persistence.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4b7596"/></marker></defs><rect width="1280" height="360" rx="18" fill="#f4f8fc"/><rect x="0" y="0" width="1280" height="8" fill="#167b8b"/><text x="50" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#15344b">Enterprise ERP · system architecture</text><text x="50" y="99" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#526d80">UI workflows connect to a separate business API and relational persistence.</text><rect x="50" y="156" width="215.2" height="92" rx="12" fill="#ffffff" stroke="#19899a" stroke-width="2" /><text x="157.6" y="191" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#15344b">Angular</text><text x="157.6" y="221" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#526d80">Frontend modules</text><path d="M268.2 202 H286.2" fill="none" stroke="#4b7596" stroke-width="2" marker-end="url(#arrow)" /><rect x="291.2" y="156" width="215.2" height="92" rx="12" fill="#ffffff" stroke="#bdcfdd" stroke-width="2" /><text x="398.79999999999995" y="191" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#15344b">ASP.NET Core</text><text x="398.79999999999995" y="221" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#526d80">HTTP / JSON API</text><path d="M509.4 202 H527.4" fill="none" stroke="#4b7596" stroke-width="2" marker-end="url(#arrow)" /><rect x="532.4" y="156" width="215.2" height="92" rx="12" fill="#ffffff" stroke="#bdcfdd" stroke-width="2" /><text x="640" y="191" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#15344b">Business logic</text><text x="640" y="221" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#526d80">Workflow rules</text><path d="M750.5999999999999 202 H768.5999999999999" fill="none" stroke="#4b7596" stroke-width="2" marker-end="url(#arrow)" /><rect x="773.5999999999999" y="156" width="215.2" height="92" rx="12" fill="#ffffff" stroke="#bdcfdd" stroke-width="2" /><text x="881.1999999999999" y="191" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#15344b">EF Core</text><text x="881.1999999999999" y="221" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#526d80">Data persistence</text><path d="M991.8 202 H1009.8" fill="none" stroke="#4b7596" stroke-width="2" marker-end="url(#arrow)" /><rect x="1014.8" y="156" width="215.2" height="92" rx="12" fill="#e0f3ef" stroke="#bdcfdd" stroke-width="2" /><text x="1122.3999999999999" y="191" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#15344b">SQL Server</text><text x="1122.3999999999999" y="221" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#526d80">Relational database</text><text x="50" y="315" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#526d80">Repository scope: Angular frontend. API, business logic, persistence and database are separate dependencies.</text></svg>